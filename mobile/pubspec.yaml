name: parentconnect
description: ParentConnect AI mobile app (Flutter). Offline-first. See ADR-0015.
publish_to: "none"
version: 0.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Kept deliberately small — every package is APK weight against the <25 MB
  # ceiling (NFR-28). `http` for the backend, `shared_preferences` for the
  # offline referral-directory cache so "get help" works with no network.
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  # A full offline content store (drift/sqflite) + background sync land with
  # the offline content pack, FR-18 (ADR-0008/0015).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # NFR-28 (<25 MB APK) is tight for Flutter — bundle minimally; fetch audio and
  # illustrations on demand rather than shipping them. Validate release size in
  # a Phase-1 spike (ADR-0015).
