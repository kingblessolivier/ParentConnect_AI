# Local development dependencies only. NOT a production deployment.
# Production hosts personal data in-region (ADR-0009) with managed services.
services:
  db:
    # pgvector image = PostgreSQL + the vector extension (ADR-0002).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: parentconnect
      POSTGRES_PASSWORD: parentconnect
      POSTGRES_DB: parentconnect
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Local object storage stand-in (audio, media, content packs). Prod uses a
  # managed in-region object store.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: parentconnect
      MINIO_ROOT_PASSWORD: parentconnect
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  db_data:
  minio_data:
