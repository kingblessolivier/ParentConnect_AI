[project]
name = "parentconnect-ai"
version = "0.0.0"
description = "ParentConnect AI RAG/evaluation service (Python). See ADR-0014."
requires-python = ">=3.11"
dependencies = [
    # Eval-set authoring format is human-friendly YAML (evaluation/authoring.py).
    "pyyaml>=6.0",
    # HTTP service the Node backend calls (service/app.py, ADR-0014).
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Further RAG/retrieval dependencies land in Phase 0/1 (kept minimal for now).
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "httpx>=0.27",  # FastAPI TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Localized coach fallback messages are single translation strings; splitting
# them across lines hurts readability more than a long line does.
"src/parentconnect_ai/service/pipeline.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=parentconnect_ai --cov-report=term-missing"

[tool.coverage.run]
source = ["parentconnect_ai"]
omit = ["*/service/main.py"]  # uvicorn entrypoint, exercised only when served
